<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake 🐍</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      color: #e2e8f0;
      padding: 16px;
    }
    h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #34d399, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .scoreboard {
      display: flex;
      gap: 24px;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .scoreboard span { color: var(--accent); }
    .stage {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      background: #0b1220;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      background: rgba(8, 15, 30, 0.85);
      backdrop-filter: blur(3px);
      padding: 20px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.8rem; }
    .overlay p { color: #94a3b8; }
    .btn {
      margin-top: 8px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      color: #0b1220;
      background: linear-gradient(90deg, #34d399, #38bdf8);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .btn:hover { transform: scale(1.05); }
    .hint { font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>
  <h1>Snake 🐍</h1>
  <div class="scoreboard">
    <div>ניקוד: <span id="score">0</span></div>
    <div>שיא: <span id="high">0</span></div>
  </div>

  <div class="stage">
    <canvas id="board" width="480" height="480"></canvas>

    <div class="overlay" id="startScreen">
      <h2>Snake 🐍</h2>
      <p>אכלו את התפוחים, גדלו, והיזהרו מהקירות והמכשולים!</p>
      <button class="btn" id="startBtn">התחל משחק</button>
      <p class="hint">שליטה: מקשי חצים או W A S D</p>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <h2>Game Over</h2>
      <p>הניקוד שלך: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">שחק שוב</button>
      <p class="hint">Enter או רווח כדי לשחק שוב</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");

    const CELL = 24;                       // גודל תא בפיקסלים
    const COLS = canvas.width / CELL;       // מספר עמודות
    const ROWS = canvas.height / CELL;      // מספר שורות

    const scoreEl = document.getElementById("score");
    const highEl = document.getElementById("high");
    const finalScoreEl = document.getElementById("finalScore");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");

    let snake, dir, nextDir, apple, obstacles, score, highScore, tickInterval;
    let state = "MENU";                    // MENU | PLAYING | GAME_OVER
    let lastTick = 0;

    highScore = Number(localStorage.getItem("snakeHighScore")) || 0;
    highEl.textContent = highScore;

    // מיקומי מכשולים קבועים על הלוח
    const OBSTACLES = [
      { x: 5, y: 5 }, { x: 5, y: 6 }, { x: 5, y: 7 },
      { x: 14, y: 12 }, { x: 15, y: 12 }, { x: 16, y: 12 },
      { x: 9, y: 15 }, { x: 9, y: 16 }, { x: 9, y: 17 },
    ];

    function samePos(a, b) { return a.x === b.x && a.y === b.y; }

    function occupied(pos) {
      return snake.some(s => samePos(s, pos)) || obstacles.some(o => samePos(o, pos));
    }

    function placeApple() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (occupied(pos));
      apple = pos;
    }

    function resetGame() {
      snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      obstacles = OBSTACLES.map(o => ({ ...o }));
      score = 0;
      tickInterval = 150;                  // מהירות התחלתית (מ"ש לצעד)
      scoreEl.textContent = score;
      placeApple();
    }

    function startGame() {
      resetGame();
      state = "PLAYING";
      startScreen.classList.add("hidden");
      gameOverScreen.classList.add("hidden");
    }

    function gameOver() {
      state = "GAME_OVER";
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("snakeHighScore", highScore);
        highEl.textContent = highScore;
      }
      finalScoreEl.textContent = score;
      gameOverScreen.classList.remove("hidden");
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // התנגשות בקיר
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // התנגשות בגוף עצמו או במכשול
      if (snake.some(s => samePos(s, head)) || obstacles.some(o => samePos(o, head))) {
        return gameOver();
      }

      snake.unshift(head);

      if (samePos(head, apple)) {
        score += 10;
        scoreEl.textContent = score;
        // האצה הדרגתית עם רצפת מהירות
        tickInterval = Math.max(60, tickInterval - 5);
        placeApple();
      } else {
        snake.pop();
      }
    }

    function drawCell(pos, color, radius = 5) {
      const x = pos.x * CELL, y = pos.y * CELL;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x + 1, y + 1, CELL - 2, CELL - 2, radius);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      obstacles.forEach(o => drawCell(o, "#475569", 4));
      drawCell(apple, "#f43f5e", 12);

      snake.forEach((seg, i) => {
        // גרדיאנט צבעוני לאורך הנחש
        const t = snake.length > 1 ? i / (snake.length - 1) : 0;
        const hue = 150 + t * 120;         // מירוק לכחול/סגול
        const color = i === 0 ? "#fbbf24" : `hsl(${hue}, 70%, 55%)`;
        drawCell(seg, color, i === 0 ? 8 : 5);
      });
    }

    function loop(timestamp) {
      if (state === "PLAYING") {
        if (timestamp - lastTick >= tickInterval) {
          lastTick = timestamp;
          step();
        }
        draw();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // שליטה
    const KEY_DIRS = {
      ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
      ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
      w: { x: 0, y: -1 }, s: { x: 0, y: 1 }, a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
    };

    document.addEventListener("keydown", (e) => {
      if (state !== "PLAYING") {
        if (e.key === "Enter" || e.key === " ") startGame();
        return;
      }
      const d = KEY_DIRS[e.key];
      if (!d) return;
      e.preventDefault();
      // מניעת היפוך ישיר לתוך הגוף (נבדק מול הכיוון הנוכחי)
      if (d.x === -dir.x && d.y === -dir.y) return;
      nextDir = d;
    });

    document.getElementById("startBtn").addEventListener("click", startGame);
    document.getElementById("restartBtn").addEventListener("click", startGame);
  </script>
</body>
</html>
